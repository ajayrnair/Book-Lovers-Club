<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Peeps</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta name="theme-color" content="#3d1436">
<style>
  :root{--bg:#3d1436;--plum:#2e0e28;--card:#fff9f1;--ink:#2b1421;--muted:#8d6a7a;--accent:#c93a54;--accent2:#8b5cf6;--teal:#17a398;--line:#ecd9c6;--good:#2e7d32;--danger:#cf2233;--cream:#fff3e2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.42;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;background:rgba(46,14,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;color:var(--cream)}
  header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff7e5f,#f95d6a,#8b5cf6,#17a398,#1b8fa8)}
  h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;display:flex;align-items:center}
  .concept{font-size:10.5px;font-weight:700;color:#2e0e28;background:#ffb59f;border-radius:999px;padding:3px 9px;white-space:nowrap}
  h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:24px 0 10px;color:#ffe9d2}
  .card h2,.sheet h2{color:var(--ink)}
  h3{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:16px 0 8px}
  main{padding:2px 16px 112px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(20,4,16,.20),0 10px 28px rgba(20,4,16,.14)}
  .row{display:flex;gap:12px;align-items:center}
  .grow{flex:1}
  input,select,button,textarea{font-size:17px;font-family:inherit}
  input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,58,84,.5);outline-offset:0;border-color:transparent}
  button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;font-weight:600;font-size:16px;transition:transform .08s ease}
  button:active{transform:scale(.98)}
  button.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
  button.small{padding:8px 14px;min-height:40px;font-size:15px;border-radius:10px}
  button:disabled{opacity:.45}
  button.danger{background:var(--danger);color:#fff}
  button.ghost.danger{background:var(--card);color:var(--danger);border-color:var(--danger)}
  button.ic{display:inline-flex;align-items:center;gap:6px}
  button.iconbtn{background:none;border:0;color:#ff8a66;padding:6px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .ordiv{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:13px}
  .ordiv:before,.ordiv:after{content:'';flex:1;border-top:1px solid var(--line)}
  button.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-family:Roboto,Arial,sans-serif;font-weight:500}
  button.gbtn svg{flex:none;display:block}
  .muted{color:var(--muted);font-size:14px}
  .onbg{color:#d9a8c2;font-size:14px}
  .err{color:#b3261e;font-size:14px;min-height:18px}
  .book{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .book:last-child{border-bottom:0}
  .cover{width:50px;height:74px;object-fit:cover;border-radius:6px;background:#f3e2d3;flex:none}
  .cover.big{width:64px;height:95px;border-radius:8px}
  .stars{color:var(--accent2);font-size:13px}
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(46,14,40,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.09);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;color:#d9a8c2;border-radius:0;padding:8px 0 7px;min-height:52px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button.on{color:#ff8a66}
  .chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:40px;margin:3px 3px 3px 0;font-size:15px;background:#fff;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .day{flex:1;text-align:center;padding:9px 0;min-height:54px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:15px;color:var(--ink)}
  .day.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .day .n{display:block;font-size:11px;color:inherit;opacity:.75}
  .hide{display:none}
  a{color:var(--accent)}
  .badge{font-size:11px;font-weight:700;background:#fde8d8;color:var(--accent);border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:2px}
  .voteBar{height:6px;background:#f3ddc8;border-radius:3px;overflow:hidden}
  .voteBar i{display:block;height:100%;background:var(--accent2)}
  select.rate{width:auto;padding:8px 10px;margin:0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
  .book select.rate,.book button{align-self:center}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#5b2144;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;max-width:90%;box-shadow:0 8px 24px rgba(20,4,16,.35)}
  .overlay{position:fixed;inset:0;background:rgba(30,6,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:86vh;overflow:auto;animation:slideup .22s ease-out}
  @media(min-width:640px){.overlay{align-items:center}.sheet{width:380px;max-width:92%;border-radius:20px;padding:20px}}
  @keyframes slideup{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
  .setrow{cursor:pointer}
  .datefield{position:relative}
  .datefield input[type=date]{margin:0;padding-right:44px;cursor:pointer;min-height:48px}
  .datefield input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;top:0;width:44px;height:100%;cursor:pointer}
  .datefield .cal{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--accent);display:flex;pointer-events:none}
  .brand{text-align:center;padding:30px 0 4px;color:var(--cream)}
  .brand img{width:78px;height:78px;border-radius:19px;box-shadow:0 10px 28px rgba(20,4,16,.35)}
  .brand .bname{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:12px;color:#ffe9d2}
  .clubtag{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em}
  .bigbtn{width:100%;min-height:56px;font-size:18px;border-radius:14px}
  header button.ghost.small{padding:6px 10px;min-height:36px;font-size:13px;background:transparent;color:#ffb59f;border-color:rgba(255,181,159,.55);white-space:nowrap}
  :focus-visible{outline:2px solid #ff8a66;outline-offset:2px}

  .decknav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .clubcard{background:var(--card);border-radius:22px;padding:20px;min-height:440px;box-shadow:0 2px 4px rgba(20,4,16,.25),0 18px 40px rgba(20,4,16,.3);display:flex;flex-direction:column;margin-top:10px}
  .facebtns{display:flex;gap:6px;margin-top:auto;padding-top:16px}
  .facebtns button{flex:1;background:#f6e3cd;color:var(--ink);min-height:46px;border-radius:11px;font-size:15px}
  .facebtns button.on{background:var(--accent);color:#fff}
  .deckdots{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .deckdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,233,210,.3);display:block}
  .deckdots i.on{background:#ff8a66}
  .cardcover{width:118px;height:174px;border-radius:9px;object-fit:cover;background:#f3e2d3;box-shadow:0 12px 26px rgba(20,4,16,.25);margin:8px auto;display:block}
  .pickrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .pickrow:last-child{border-bottom:0}
  .voterow{display:flex;gap:12px;align-items:center;padding:10px;margin:8px 0;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
  .voterow.mine{border-color:var(--accent);background:#fdeeea}
  .voterow .vbar{height:6px;background:#f3ddc8;border-radius:3px;overflow:hidden;margin-top:6px}
  .voterow .vbar i{display:block;height:100%;background:var(--accent2)}
  .picktag{color:var(--accent);font-size:12.5px;font-weight:700;margin-top:2px}
  .day.best{border-color:var(--teal);box-shadow:0 0 0 2px rgba(23,163,152,.4)}
  .facehead{text-align:center}
  .snaprow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header><h1><img src="/icon.svg" alt="" style="width:26px;height:26px;border-radius:7px;margin-right:8px">Reading&nbsp;Peeps</h1><span class="concept">Concept 8 · Card Stack</span><button class="ghost small" id="signOut">Sign out</button></header>
<main id="app"></main>
<div id="modal"></div>
<div class="toast hide" id="toast"></div>
<nav id="tabs"><button data-tab="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Clubs</span></button><button data-tab="add" class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Add Books</span></button><button data-tab="me" class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Me</span></button></nav>
<script>

const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
let token = localStorage.getItem('blc_token') || '';
if(location.hash.startsWith('#t=')){ token = location.hash.slice(3); localStorage.setItem('blc_token', token); history.replaceState(null, '', location.pathname); }
let user = null, myClubs = [], currentClub = null, tab = 'home';
let details = {}; // clubId -> full club object
let addSel = new Map(); let searchResults = []; let addReturn = null;

const ICONS = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  lib: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/><path d="M9 11h5"/>'
};
function icon(n, s=20){ return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`; }
function showModal(html){ $('#modal').innerHTML = `<div class="overlay" id="ovl"><div class="sheet">${html}</div></div>`; $('#ovl').onclick = (e)=>{ if(e.target.id==='ovl') closeModal(); }; }
function closeModal(){ $('#modal').innerHTML=''; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hide'); setTimeout(()=>t.classList.add('hide'), 2600); }
async function api(action, body={}){
  const r = await fetch('/api/handler', { method:'POST', headers:{'content-type':'application/json', ...(token?{authorization:'Bearer '+token}:{})}, body: JSON.stringify({action, ...body}) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(ds){ if(!ds) return ''; const d=new Date(ds+'T12:00:00'); return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }
function ratingsLine(b){
  const parts=[];
  if(b.google) parts.push(`Google ★ ${b.google.rating} (${b.google.count})`);
  if(b.hardcover && !(b.google && b.google.count > (b.hardcover.count||0)*10)) parts.push(`Hardcover ★ ${b.hardcover.rating} (${b.hardcover.count})`);
  if(!b.google && !b.hardcover && b.openlibrary) parts.push(`Open Library ★ ${b.openlibrary.rating} (${b.openlibrary.count})`);
  return parts.length ? `<div class="stars">${parts.join(' · ')}</div>` : '';
}
function halfOptions(sel){ let o=''; for(let v=0; v<=5; v+=0.5){ o+=`<option value="${v}" ${sel===v?'selected':''}>${v===0?'Rate':v+' ★'}</option>`; } return o; }
function pollDefaultEnd(c){
  const week = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  if(c.meeting && c.meeting.date){ const d = new Date(c.meeting.date + 'T12:00:00'); if(!isNaN(d.getTime())){ d.setDate(d.getDate() - 1); const ds = d.toISOString().slice(0, 10); return ds < week ? ds : week; } }
  return week;
}
async function refreshClubs(){ const j = await api('myClubs'); myClubs = j.clubs; }
async function loadDetails(){ details = {}; await Promise.all(myClubs.map(async c=>{ try{ const j = await api('club',{clubId:c.id}); details[c.id]=j.club; }catch(e){} })); }
async function reloadClub(id){ const j = await api('club',{clubId:id}); details[id]=j.club; if(currentClub && currentClub.id===id) currentClub=j.club; return j.club; }
function wireRates(root, rerender){
  (root||app).querySelectorAll('[data-rate]').forEach(s=>s.onchange=async()=>{ await api('rate',{bookKey:s.dataset.rate, rating:Number(s.value)}); toast('Saved'); if(rerender) rerender(); });
}
function bookRow(b, opts={}){
  return `<div class="book">
    ${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="">`:'<div class="cover"></div>'}
    <div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}${b.year?' · '+b.year:''}</div>
    ${ratingsLine(b)}
    ${b.memberCount?`<div class="muted">Members ★ ${b.memberAverage} (${b.memberCount})</div>`:''}
    </div>
    <select class="rate" data-rate="${b.key}">${halfOptions(b.myRating)}</select>
    ${opts.current?`<button class="small ghost" data-setcurrent="${b.key}">Reading now</button>`:''}
  </div>`;
}
function wireSetCurrent(rerender){
  app.querySelectorAll('[data-setcurrent]').forEach(b=>b.onclick=async()=>{ const go=()=>api('setCurrent',{clubId:currentClub.id, bookKey:b.dataset.setcurrent}); try{ const j=await go(); details[currentClub.id]=j.club; currentClub=j.club; rerender(); }catch(e1){ await new Promise(r=>setTimeout(r,900)); try{ const j=await go(); details[currentClub.id]=j.club; currentClub=j.club; rerender(); }catch(e2){ toast(e2.message); } } });
}
function viewAuth(msg=''){
  $('#tabs').classList.add('hide'); $('#signOut').classList.add('hide');
  const gLogo = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-.95.66-2.23 1.08-4.07 1.08-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.21c-.25-.66-.38-1.4-.38-2.21s.14-1.55.38-2.21V6.7H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.3l3.98-3.09z"/><path fill="#EA4335" d="M12 4.83c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.21 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.7l3.98 3.09C6.22 6.94 8.87 4.83 12 4.83z"/></svg>';
  app.innerHTML = `
  <div class="brand"><img src="/icon.svg" alt=""><div class="bname">Reading Peeps</div></div>
  <div class="card" id="formIn">
    <h2 style="margin-top:2px">Sign in</h2>
    <input type="email" id="inEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="inPw" placeholder="Password" autocomplete="current-password">
    <div class="err" id="inErr">${esc(msg)}</div>
    <button id="signin" style="width:100%">Sign in</button>
    <div class="ordiv">or</div>
    <button class="gbtn" data-g>${gLogo}<span>Sign in with Google</span></button>
    <div style="text-align:center;margin-top:12px"><a href="#" id="toSignup">Create account</a></div>
  </div>
  <div class="card hide" id="formUp">
    <h2 style="margin-top:2px">Create account</h2>
    <input type="text" id="upName" placeholder="Your name" autocomplete="name">
    <input type="email" id="upEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="upPw" placeholder="Password" autocomplete="new-password">
    <div class="err" id="upErr"></div>
    <button id="signup" style="width:100%">Create account</button>
    <div style="text-align:center;margin-top:12px"><a href="#" id="toSignin">Sign in</a></div>
  </div>`;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ location.href = '/api/auth/google'; });
  $('#toSignup').onclick = (e)=>{ e.preventDefault(); $('#formIn').classList.add('hide'); $('#formUp').classList.remove('hide'); };
  $('#toSignin').onclick = (e)=>{ e.preventDefault(); $('#formUp').classList.add('hide'); $('#formIn').classList.remove('hide'); };
  $('#signin').onclick = async ()=>{ try{ const j=await api('signin',{email:$('#inEmail').value, password:$('#inPw').value}); afterAuth(j); }catch(e){ $('#inErr').textContent=e.message; } };
  $('#signup').onclick = async ()=>{ try{ const j=await api('signup',{name:$('#upName').value, email:$('#upEmail').value, password:$('#upPw').value}); afterAuth(j); }catch(e){ $('#upErr').textContent=e.message; } };
}
async function afterAuth(j){
  token = j.token; user = j.user; localStorage.setItem('blc_token', token);
  const inv = localStorage.getItem('blc_invite');
  if(inv){ localStorage.removeItem('blc_invite'); try{ const r=await api('acceptInvite',{inviteToken:inv}); toast('You joined '+r.club.name); }catch(e){ toast(e.message); } }
  boot();
}
$('#signOut').onclick = async ()=>{ try{ await api('signout'); }catch(e){} token=''; user=null; currentClub=null; details={}; localStorage.removeItem('blc_token'); viewAuth(); };
function setTab(t){ tab=t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x.dataset.tab===t)); }
async function boot(){
  try{ const j = await api('me'); user = j.user; }catch(e){ return viewAuth(''); }
  $('#tabs').classList.remove('hide'); $('#signOut').classList.remove('hide');
  await refreshClubs(); await loadDetails();
  startApp();
}
const inv = new URLSearchParams(location.search).get('invite');
if(inv){ localStorage.setItem('blc_invite', inv); history.replaceState({}, '', location.pathname); }

// ---------- shared: clubs home (list + create + find) ----------
function clubStatusLine(c){
  const d = details[c.id]; if(!d) return `${c.memberCount} member${c.memberCount>1?'s':''}`;
  const parts = [];
  parts.push(d.current ? 'Reading: '+d.current.title : 'No book picked yet');
  if(d.poll) parts.push('Poll open');
  if(d.meeting && d.meeting.date) parts.push('Meets '+fmtDate(d.meeting.date));
  return parts.join(' · ');
}

function viewPollPage(){
  const c = currentClub; if(!c) return;
  const isAdmin = c.role==='admin';
  let body = '';
  if(c.poll){
    body = `<h3 style="margin-top:0">Pick the next book${c.poll.runoff?' · Runoff':''}</h3>
    ${c.poll.options.map(o=>`<div style="margin:8px 0"><div class="row"><div class="grow">${esc(o.book.title)}</div><b>${o.votes}</b><button class="small" data-vote="${o.book.key}">Vote</button></div><div class="voteBar"><i style="width:${c.poll.totalVotes?Math.round(o.votes/c.poll.totalVotes*100):0}%"></i></div></div>`).join('')}
    <div class="muted">Closes ${new Date(c.poll.closesAt).toLocaleDateString(undefined,{month:'short', day:'numeric'})}</div>
    ${isAdmin?'<button id="closePoll" class="ghost small" style="margin-top:6px">Close poll</button>':''}`;
  } else if(c.lastResult && c.lastResult.tie){
    body = `<h3 style="margin-top:0">Tie</h3>${isAdmin?'<button id="runoff" class="small">One day runoff</button> '+c.lastResult.tie.map(k=>{const b=c.library.find(x=>x.key===k); return b?`<button class="small ghost" data-pick="${k}">Pick ${esc(b.title)}</button>`:'';}).join(' '):'<div class="muted">The admin picks the winner</div>'}`;
  } else if(isAdmin && c.library.length>=2){
    body = `<h3 style="margin-top:0">Start a poll</h3>
    <div class="muted" style="margin:6px 0 4px">End date</div>
    <div class="datefield"><input type="date" id="pollEnd" value="${pollDefaultEnd(c)}"><span class="cal">${icon('calendar',18)}</span></div>
    <button id="doStartPoll" class="ic" style="margin-top:10px;width:100%;justify-content:center">${icon('chart',16)} Start poll</button>`;
  } else {
    body = '<div class="muted">No poll running</div>';
  }
  app.innerHTML = `
  <button class="ghost small" id="back">‹ ${esc(c.name)}</button>
  <div class="card" style="margin-top:8px">${body}</div>`;
  $('#back').onclick = ()=>renderClub();
  app.querySelectorAll('[data-vote]').forEach(b=>b.onclick=async()=>{ const j=await api('vote',{clubId:c.id, bookKey:b.dataset.vote}); details[c.id]=j.club; currentClub=j.club; viewPollPage(); });
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{ const j=await api('adminPick',{clubId:c.id, bookKey:b.dataset.pick}); details[c.id]=j.club; currentClub=j.club; renderClub(); });
  if($('#closePoll')) $('#closePoll').onclick=async()=>{ const j=await api('closePoll',{clubId:c.id}); details[c.id]=j.club; currentClub=j.club; renderClub(); };
  if($('#runoff')) $('#runoff').onclick=async()=>{ const j=await api('runoff',{clubId:c.id}); details[c.id]=j.club; currentClub=j.club; viewPollPage(); };
  const pe = $('#pollEnd');
  if(pe){ const pef = pe.closest('.datefield'); if(pef) pef.onclick=()=>{ try{ pe.focus(); if(pe.showPicker) pe.showPicker(); }catch(e){} }; }
  if($('#doStartPoll')) $('#doStartPoll').onclick=async()=>{ try{ const j=await api('startPoll',{clubId:c.id, endDate:$('#pollEnd').value}); details[c.id]=j.club; currentClub=j.club; viewPollPage(); }catch(e){ toast(e.message); } };

// ---------- shared card-family helpers (Index Card family) ----------
// The API does not expose the viewer's own poll vote, so it is kept here,
// keyed by poll id, whenever this client votes.
let cdVotes = {};
try{ cdVotes = JSON.parse(localStorage.getItem('blc_votes') || '{}'); }catch(e){ cdVotes = {}; }
function cdSaveVote(pollId, key){ if(!pollId) return; cdVotes[pollId] = key; try{ localStorage.setItem('blc_votes', JSON.stringify(cdVotes)); }catch(e){} }
// Per-club transient UI state (start-vote expander, meeting type switch).
let cdUi = { clubId: null, startOpen: false, meetType: null };
function cdUiFor(c){ if(cdUi.clubId !== c.id) cdUi = { clubId: c.id, startOpen: false, meetType: null }; return cdUi; }
// The test backend is one JSON document whose reads can briefly lag a
// write; the app already retries setCurrent once after ~900ms, so the other
// write actions in this family do the same.
async function cdCall(fn){ let err; for(let i = 0; i < 3; i++){ try{ return await fn(); }catch(e){ err = e; if(i < 2) await new Promise(r => setTimeout(r, 900)); } } throw err; }
async function cdSetCurrent(c, key){
  const j = await cdCall(() => api('setCurrent', { clubId: c.id, bookKey: key }));
  details[c.id] = j.club; if(currentClub && currentClub.id === c.id) currentClub = j.club;
  return j.club;
}
function cdOverlap(c){ const o = {}; Object.values(c.availability || {}).forEach(days => days.forEach(d => o[d] = (o[d] || 0) + 1)); return o; }
function cdCover(b, cls){ return b && b.cover ? `<img class="${cls || 'cover'}" src="${esc(b.cover)}" alt="">` : `<div class="${cls || 'cover'}"></div>`; }

// --- Book: pick list rows (cover, title, author; one set action for admins) ---
function cdPickRows(c, admin){
  if(!c.library.length) return '<div class="muted">No books in the library yet</div>';
  return c.library.map(b => {
    const cur = c.current && c.current.key === b.key;
    return `<div class="pickrow">${cdCover(b)}<div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div>${ratingsLine(b)}</div>${cur ? '<span class="badge">Reading now</span>' : (admin ? `<button class="small" data-setbook="${b.key}">Read this</button>` : '')}</div>`;
  }).join('');
}
function cdChangeSheet(c, rerender){
  showModal(`<h3 style="margin-top:0">Change book</h3><div>${cdPickRows(c, true)}</div>
  <button class="ghost" data-sheetadd style="margin-top:12px;width:100%">Add books</button>
  <button class="ghost small" data-sheetclose style="margin-top:8px;width:100%">Close</button>`);
  cdWireSetBook(c, rerender);
  document.querySelector('[data-sheetadd]').onclick = () => { closeModal(); setTab('add'); viewAdd(c.id); };
  document.querySelector('[data-sheetclose]').onclick = closeModal;
}
function cdWireSetBook(c, rerender){
  document.querySelectorAll('[data-setbook]').forEach(b => b.onclick = async () => { b.disabled = true; try{ await cdSetCurrent(c, b.dataset.setbook); closeModal(); rerender(); }catch(e){ b.disabled = false; toast(e.message); } });
}

function cdWireBook(c, rerender){
  wireRates(document, async () => { await reloadClub(c.id); rerender(); });
  const fin = document.querySelector('[data-fin]');
  if(fin) fin.onclick = async () => { const j = await api('toggleFinished', { clubId: c.id }); details[c.id] = j.club; rerender(); };
  cdWireSetBook(c, rerender);
  document.querySelectorAll('[data-addbooks]').forEach(b => b.onclick = () => { setTab('add'); viewAdd(c.id); });
  const ch = document.querySelector('[data-changebook]');
  if(ch) ch.onclick = () => cdChangeSheet(c, rerender);
}
// --- Vote (Next) face / section ---
function cdVoteHtml(c, ui){
  const admin = c.role === 'admin';
  if(c.poll){
    const p = c.poll;
    const mine = cdVotes[p.id];
    const ends = new Date(p.closesAt).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return `<div class="facehead"><b style="font-size:20px">${p.runoff ? 'Tiebreak vote' : 'Pick the next book'}</b>
    <div class="muted">Voting ends ${ends} · ${p.totalVotes} vote${p.totalVotes === 1 ? '' : 's'}</div>
    ${p.runoff ? '<div class="muted">The last vote tied.</div>' : ''}${mine ? '' : '<div class="muted">Tap a book to vote.</div>'}</div>
    ${p.options.map(o => { const pct = p.totalVotes ? Math.round(o.votes / p.totalVotes * 100) : 0; const isMine = mine === o.book.key;
      return `<div class="voterow ${isMine ? 'mine' : ''}" data-cdvote="${o.book.key}">${cdCover(o.book)}<div class="grow"><b>${esc(o.book.title)}</b><div class="muted">${esc(o.book.author)}</div><div class="vbar"><i style="width:${pct}%"></i></div></div><div style="text-align:right;flex:none"><b style="font-size:19px">${o.votes}</b>${isMine ? '<div class="picktag">✓ Your pick</div>' : ''}</div></div>`; }).join('')}
    ${admin ? '<button class="ghost small" id="cdClosePoll" data-closepoll style="margin-top:4px">Close the vote</button>' : ''}`;
  }
  if(c.lastResult && c.lastResult.tie){
    const tied = c.lastResult.tie.map(k => c.library.find(b => b.key === k)).filter(Boolean);
    return `<div class="facehead"><b style="font-size:20px">The vote tied</b><div class="muted" style="margin-top:4px">Only these books are still in it.</div></div>
    <div style="margin-top:6px">${tied.map(b => `<div class="pickrow">${cdCover(b)}<div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div></div>${admin ? `<button class="small ghost" data-cdpick="${b.key}">Pick</button>` : ''}</div>`).join('')}</div>
    ${admin ? '<button id="cdRunoff" data-runoff style="margin-top:12px;width:100%">Run the runoff</button>' : '<div class="muted" style="text-align:center;margin-top:10px">The admin settles the tie.</div>'}`;
  }
  if(!c.library.length){
    return `<div class="facehead" style="padding-top:26px"><b style="font-size:20px">The library is empty</b><div class="muted" style="margin-top:6px">Add books and the club can choose its next read.</div></div>
    <button id="cdAdd2" data-addbooks style="margin-top:16px;width:100%">Add books</button>`;
  }
  if(c.library.length === 1){
    const only = c.library[0];
    const isCur = c.current && c.current.key === only.key;
    return `<div class="facehead"><b style="font-size:20px">One book in the library</b></div>
    <div style="margin-top:6px">${cdPickRows(c, admin)}</div>
    ${admin && !isCur ? `<button id="cdPick1" data-pickonly style="margin-top:10px;width:100%">Make it the current book</button>` : ''}
    ${isCur ? '<div class="muted" style="text-align:center;margin-top:4px">This is the current book.</div>' : ''}
    <button class="ghost" id="cdLib" data-openlib style="margin-top:10px;width:100%">Open the library</button>`;
  }
  if(!admin){
    return `<div class="facehead" style="padding-top:26px"><b style="font-size:20px">No vote open</b><div class="muted" style="margin-top:6px">The admin starts the vote for the next book.</div></div>
    <button class="ghost" id="cdLib" data-openlib style="margin-top:14px;width:100%">Open the library</button>`;
  }
  if(!ui.startOpen){
    return `<div class="facehead" style="padding-top:26px"><b style="font-size:20px">Choose the next book</b><div class="muted" style="margin-top:6px">${c.library.length} books in the library</div></div>
    <button id="cdStartToggle" data-starttoggle style="margin-top:16px;width:100%">Start the vote</button>
    <button class="ghost" id="cdLib" data-openlib style="margin-top:10px;width:100%">Open the library</button>`;
  }
  return `<div class="facehead"><b style="font-size:20px">Start the vote</b></div>
  <div class="muted" style="margin:14px 0 4px">Vote end date</div>
  <div class="datefield"><input type="date" id="cdEnd" class="pollend" value="${pollDefaultEnd(c)}"><span class="cal">${icon('calendar', 18)}</span></div>
  <button id="cdStart" data-startopen style="margin-top:12px;width:100%">Open the vote</button>
  <button class="ghost small" data-startcancel style="margin-top:8px;width:100%">Cancel</button>`;
}
function cdWireVote(c, rerender, ui){
  document.querySelectorAll('[data-cdvote]').forEach(r => r.onclick = async () => { const pid = c.poll ? c.poll.id : null; try{ const j = await cdCall(() => api('vote', { clubId: c.id, bookKey: r.dataset.cdvote })); details[c.id] = j.club; cdSaveVote(pid, r.dataset.cdvote); rerender(); }catch(e){ toast(e.message); } });
  const cp = document.querySelector('[data-closepoll]'); if(cp) cp.onclick = async () => { const j = await api('closePoll', { clubId: c.id }); details[c.id] = j.club; rerender(); };
  const ro = document.querySelector('[data-runoff]'); if(ro) ro.onclick = async () => { const j = await api('runoff', { clubId: c.id }); details[c.id] = j.club; rerender(); };
  document.querySelectorAll('[data-cdpick]').forEach(b => b.onclick = async () => { const j = await api('adminPick', { clubId: c.id, bookKey: b.dataset.cdpick }); details[c.id] = j.club; rerender(); });
  const tg = document.querySelector('[data-starttoggle]'); if(tg) tg.onclick = () => { ui.startOpen = true; rerender(); };
  const so = document.querySelector('[data-startopen]'); if(so) so.onclick = async () => { try{ const j = await cdCall(() => api('startPoll', { clubId: c.id, endDate: document.querySelector('.pollend').value })); details[c.id] = j.club; ui.startOpen = false; rerender(); }catch(e){ toast(e.message); } };
  const sc = document.querySelector('[data-startcancel]'); if(sc) sc.onclick = () => { ui.startOpen = false; rerender(); };
  const po = document.querySelector('[data-pickonly]'); if(po) po.onclick = async () => { try{ await cdSetCurrent(c, c.library[0].key); rerender(); }catch(e){ toast(e.message); } };
  const ol = document.querySelector('[data-openlib]'); if(ol) ol.onclick = () => viewLibraryPage();
  const pe = document.querySelector('.pollend'); if(pe){ const f = pe.closest('.datefield'); if(f) f.onclick = () => { try{ pe.focus(); if(pe.showPicker) pe.showPicker(); }catch(e){} }; }
}
// --- Meeting face / section: two states (no date / date set) ---
function cdMeetingHtml(c, ui){
  const admin = c.role === 'admin';
  const head = `<div class="facehead"><b style="font-size:20px">Group meeting</b><div class="muted">Meets every ${c.meetingFrequencyWeeks} week${c.meetingFrequencyWeeks > 1 ? 's' : ''}</div></div>`;
  if(c.meeting.date){
    const myR = (c.rsvps || {})[user.id];
    const going = c.members.filter(m => (c.rsvps || {})[m.userId] === 'going').length;
    const type = (ui && ui.meetType) || c.meeting.type;
    const place = c.meeting.type === 'online'
      ? (c.meeting.link ? `<a href="${esc(c.meeting.link)}" target="_blank">Join online</a>` : '<span class="muted">Online</span>')
      : `<span class="muted">📍 ${esc(c.meeting.address || 'In person')}</span>`;
    return head + `<div style="text-align:center;margin-top:12px"><b style="font-size:24px">${fmtDate(c.meeting.date)}</b><div style="margin-top:6px">${place}</div></div>
    <div class="row" style="margin-top:14px"><button class="small ${myR === 'going' ? '' : 'ghost'}" data-cdrsvp="going" style="flex:1">Going</button><button class="small ${myR === 'notgoing' ? '' : 'ghost'}" data-cdrsvp="notgoing" style="flex:1">Not going</button></div>
    <div class="muted" style="text-align:center;margin-top:8px">${going} going</div>
    ${admin ? `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
      ${type === 'online' ? `<input type="url" class="mlink" placeholder="Meeting link" value="${esc(c.meeting.link || '')}">` : `<input type="text" class="maddr" placeholder="Address" value="${esc(c.meeting.address || '')}">`}
      <div class="row" style="margin-top:6px"><select class="mtype" style="width:auto"><option value="online" ${type === 'online' ? 'selected' : ''}>Online</option><option value="inperson" ${type === 'inperson' ? 'selected' : ''}>In person</option></select><button class="small" data-meetsave>Save</button><span class="grow"></span><button class="small ghost" id="cdChangeDate" data-changedate>Change date</button></div></div>` : ''}`;
  }
  const over = cdOverlap(c);
  const maxOver = Math.max(0, ...c.week.map(d => over[d] || 0));
  const best = maxOver > 0 ? c.week.filter(d => (over[d] || 0) === maxOver) : [];
  return head + `<div class="muted" style="text-align:center;margin-top:12px">Pick the days you are available</div>
  <div class="row" style="margin-top:10px">${c.week.map(d => { const dt = new Date(d + 'T12:00:00'); const mine = (c.availability[user.id] || []).includes(d); const n = over[d] || 0; return `<div class="day ${mine ? 'on' : ''} ${best.includes(d) ? 'best' : ''}" data-cdday="${d}"><span class="n">${'Sun Mon Tue Wed Thu Fri Sat'.split(' ')[dt.getDay()]}</span>${dt.getDate()}<span class="n">${n} ✓</span></div>`; }).join('')}</div>
  ${admin && best.length ? `<div class="clubtag" style="margin-top:14px">${best.length > 1 ? 'Best days' : 'Best day'}</div>${best.map(d => `<button data-cdsetday="${d}" style="margin-top:8px;width:100%">Set ${fmtDate(d)} · ${maxOver} in</button>`).join('')}` : ''}
  ${admin && !best.length ? `<div class="muted" style="margin-top:14px">Or pick a date</div><div class="datefield" style="margin-top:6px"><input type="date" class="pickdate"><span class="cal">${icon('calendar', 18)}</span></div>` : ''}`;
}
function cdWireMeeting(c, rerender, ui){
  document.querySelectorAll('[data-cdrsvp]').forEach(b => b.onclick = async () => { const cur = ((details[c.id] || c).rsvps || {})[user.id]; const status = cur === b.dataset.cdrsvp ? '' : b.dataset.cdrsvp; try{ const j = await cdCall(() => api('rsvp', { clubId: c.id, status })); details[c.id] = j.club; rerender(); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-cdday]').forEach(d => d.onclick = async () => { const mine = new Set(((details[c.id] || c).availability[user.id] || [])); const day = d.dataset.cdday; mine.has(day) ? mine.delete(day) : mine.add(day); const days = [...mine]; try{ const j = await cdCall(() => api('availability', { clubId: c.id, days })); details[c.id] = j.club; rerender(); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-cdsetday]').forEach(b => b.onclick = async () => { try{ const j = await cdCall(() => api('pickDate', { clubId: c.id, date: b.dataset.cdsetday })); details[c.id] = j.club; rerender(); }catch(e){ toast(e.message); } });
  const mt = document.querySelector('.mtype'); if(mt) mt.onchange = () => { ui.meetType = mt.value; rerender(); };
  const sv = document.querySelector('[data-meetsave]'); if(sv) sv.onclick = async () => { const t = (ui && ui.meetType) || c.meeting.type; const m = { type: t }; if(t === 'online'){ const el = document.querySelector('.mlink'); m.link = el ? el.value : ''; } else { const el = document.querySelector('.maddr'); m.address = el ? el.value : ''; } const j = await api('clubSettings', { clubId: c.id, meeting: m }); details[c.id] = j.club; ui.meetType = null; toast('Saved'); rerender(); };
  const chd = document.querySelector('[data-changedate]'); if(chd) chd.onclick = async () => { try{ const j = await api('clubSettings', { clubId: c.id, meeting: { date: null } }); details[c.id] = j.club; rerender(); }catch(e){ toast(e.message); } };
  const pd = document.querySelector('.pickdate'); if(pd){ const f = pd.closest('.datefield'); if(f) f.onclick = () => { try{ pd.focus(); if(pd.showPicker) pd.showPicker(); }catch(e){} }; pd.onchange = async () => { if(!pd.value) return; try{ const j = await cdCall(() => api('pickDate', { clubId: c.id, date: pd.value })); details[c.id] = j.club; rerender(); }catch(e){ toast(e.message); } }; }
}
// --- Small shared bits ---
function cdRsvpMini(c){
  const myR = (c.rsvps || {})[user.id];
  const going = c.members.filter(m => (c.rsvps || {})[m.userId] === 'going').length;
  return `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"><div class="muted" style="text-align:center">Meeting ${fmtDate(c.meeting.date)} · ${going} going</div>
  <div class="row" style="margin-top:8px"><button class="small ${myR === 'going' ? '' : 'ghost'}" data-cdrsvp="going" style="flex:1">Going</button><button class="small ${myR === 'notgoing' ? '' : 'ghost'}" data-cdrsvp="notgoing" style="flex:1">Not going</button></div></div>`;
}
function cdSnapLines(c){
  return `<div class="snaprow"><span class="muted">Meeting</span><b>${c.meeting.date ? fmtDate(c.meeting.date) : 'No date yet'}</b></div>
  ${c.current ? `<div class="snaprow"><span class="muted">Finished</span><b>${(c.finishedBy || []).length} of ${c.members.length}</b></div>` : ''}
  <div class="snaprow"><span class="muted">Next book</span><b>${c.poll ? (c.poll.runoff ? 'Tiebreak vote open' : 'Vote open') : ((c.lastResult && c.lastResult.tie) ? 'Vote tied' : 'No vote open')}</b></div>`;
}
function cdCreateFindHtml(){
  return `<div class="card"><input type="text" id="newName" placeholder="New club name"><div class="row" style="margin-top:8px">
  <select id="newVis" class="grow" style="margin:0"><option value="private" selected>Private</option><option value="public">Public</option></select>
  <button id="create">Create</button></div></div>
  <div class="card"><h3 style="margin-top:0">Find a club</h3>
  <div class="row"><input type="text" id="q" placeholder="Search clubs" class="grow"><button id="go" class="small">Search</button></div>
  <div id="found"></div></div>`;
}
function cdWireCreateFind(onShow){
  const cr = $('#create'); if(!cr) return;
  cr.onclick = async () => { try{ const j = await api('createClub', { name: $('#newName').value, private: $('#newVis').value === 'private' }); await refreshClubs(); await loadDetails(); onShow(j.club.id); }catch(e){ toast(e.message); } };
  const search = async () => { const j = await api('searchClubs', { q: $('#q').value }); const f = $('#found'); if(!f) return; f.innerHTML = j.clubs.map(x => `<div class="row" style="padding:6px 0"><div class="grow"><b>${esc(x.name)}</b><div class="muted">${x.memberCount} member${x.memberCount > 1 ? 's' : ''}</div></div>${x.isMember ? '<span class="muted">Joined</span>' : `<button class="small" data-join="${x.id}">Join</button>`}</div>`).join('') || '<div class="muted">Nothing found</div>';
    app.querySelectorAll('[data-join]').forEach(b => b.onclick = async () => { await api('joinClub', { clubId: b.dataset.join }); await refreshClubs(); await loadDetails(); search(); }); };
  $('#go').onclick = search; search();
}
function cdDeckNav(idx, total, prevId, nextId){
  return `<div class="decknav"><button class="ghost small" id="${prevId}" ${idx === 0 ? 'disabled' : ''}>‹ Prev club</button><span class="onbg">${idx + 1} of ${total}</span><button class="ghost small" id="${nextId}" ${idx === total - 1 ? 'disabled' : ''}>Next club ›</button></div>`;
}
function cdDots(idx, total){ return `<div class="deckdots">${Array.from({ length: total }, (_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</div>`; }
function cdWireTabs(startFn){
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { setTab(b.dataset.tab); if(tab === 'home'){ currentClub = null; startFn(); } if(tab === 'add') viewAdd(); if(tab === 'me') viewMe(); });
}
// ---------- Concept 8: CARD STACK / NEXT CARD ----------
let stackIdx = 0; let stackMode = 'auto';
function startApp(){ setTab('home'); viewStack(); }
function renderClub(){
  const i = myClubs.findIndex(x => x.id === currentClub.id);
  if(i >= 0) stackIdx = i;
  stackMode = 'auto';
  viewStack();
}
function stackPriority(c){
  if(c.poll) return { key: 'next', label: 'Vote for the next book' };
  if(c.lastResult && c.lastResult.tie) return { key: 'next', label: 'The vote tied' };
  if(!c.current) return { key: 'book', label: 'Pick the book' };
  if(!c.meeting.date) return { key: 'meeting', label: 'Set the meeting day' };
  return { key: 'book', label: 'Reading now' };
}
function viewStack(){
  if(!myClubs.length){
    app.innerHTML = `<h2>My clubs</h2><div class="card"><h3 style="margin-top:0">No clubs yet</h3><div class="muted">Create one below, or find one to join.</div></div>` + cdCreateFindHtml();
    cdWireCreateFind(id => { const i = myClubs.findIndex(x => x.id === id); if(i >= 0) stackIdx = i; stackMode = 'auto'; viewStack(); });
    return;
  }
  stackIdx = Math.min(stackIdx, myClubs.length - 1);
  const cc = details[myClubs[stackIdx].id]; if(!cc){ openClub(myClubs[stackIdx].id); return; }
  currentClub = cc;
  const isAdmin = cc.role === 'admin';
  const ui = cdUiFor(cc);
  const pri = stackPriority(cc);
  let zone = '', zoneLabel = '';
  if(stackMode === 'auto'){
    zoneLabel = pri.label;
    if(pri.key === 'book') zone = cdBookHtml(cc) + (cc.current && cc.meeting.date ? cdRsvpMini(cc) : '');
    else if(pri.key === 'meeting') zone = cdMeetingHtml(cc, ui);
    else zone = cdVoteHtml(cc, ui);
  } else if(stackMode === 'book'){ zoneLabel = 'Book'; zone = cdBookHtml(cc); }
  else if(stackMode === 'meeting'){ zoneLabel = 'Meeting'; zone = cdMeetingHtml(cc, ui); }
  else { zoneLabel = 'Next book'; zone = cdVoteHtml(cc, ui); }
  app.innerHTML = `
  ${cdDeckNav(stackIdx, myClubs.length, 'stackPrev', 'stackNext')}
  <div class="clubcard">
    <div class="row"><b style="font-size:21px" class="grow">${esc(cc.name)}${cc.private ? '<span class="badge">Private</span>' : ''}</b>${isAdmin ? `<button class="iconbtn" id="gear" aria-label="Settings" style="color:var(--accent)">${icon('gear', 22)}</button>` : ''}</div>
    <div class="muted">${cc.members.length} member${cc.members.length > 1 ? 's' : ''}</div>
    <div class="clubtag" style="margin-top:10px">${stackMode === 'auto' ? 'Now · ' : ''}${esc(zoneLabel)}</div>
    <div style="margin-top:8px">${zone}</div>
    <div class="facebtns"><button data-smode="auto" class="${stackMode === 'auto' ? 'on' : ''}">Now</button><button data-smode="book" class="${stackMode === 'book' ? 'on' : ''}">Book</button><button data-smode="meeting" class="${stackMode === 'meeting' ? 'on' : ''}">Meeting</button><button data-smode="next" class="${stackMode === 'next' ? 'on' : ''}">Next</button></div>
  </div>
  ${cdDots(stackIdx, myClubs.length)}
  <div style="margin-top:14px">${cdCreateFindHtml()}</div>`;
  cdWireCreateFind(id => { const i = myClubs.findIndex(x => x.id === id); if(i >= 0) stackIdx = i; stackMode = 'auto'; viewStack(); });
  $('#stackPrev').onclick = () => { if(stackIdx > 0){ stackIdx--; stackMode = 'auto'; viewStack(); } };
  $('#stackNext').onclick = () => { if(stackIdx < myClubs.length - 1){ stackIdx++; stackMode = 'auto'; viewStack(); } };
  app.querySelectorAll('[data-smode]').forEach(b => b.onclick = () => { stackMode = b.dataset.smode; viewStack(); });
  if(isAdmin) $('#gear').onclick = () => viewSettingsPage();
  cdWireBook(cc, viewStack);
  cdWireMeeting(cc, viewStack, ui);
  cdWireVote(cc, viewStack, ui);
}
cdWireTabs(startApp);
if(token) boot(); else viewAuth();

</script>
</body>
</html>
